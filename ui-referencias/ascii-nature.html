<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPath — Metraje natural → ASCII / mosaico / isolíneas</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--amber:#e07b00;--amber-l:#f7a927;--cream:#faf8f4;--fm:'JetBrains Mono',monospace;--fd:'Fraunces',Georgia,serif;--fb:'Space Grotesk',system-ui,sans-serif}
  body{background:#080705;color:var(--cream);font-family:var(--fb);min-height:100vh;overflow:hidden}
  .stage{position:relative;width:100vw;height:100vh;overflow:hidden}
  video{display:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* abstract grid overlay */
  .grid{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:.4;mix-blend-mode:overlay;
    background:linear-gradient(rgba(245,237,224,.06) 1px,transparent 1px) 0 0/100% 92px,
               linear-gradient(90deg,rgba(245,237,224,.06) 1px,transparent 1px) 0 0/132px 100%}
  .vign{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse 90% 80% at 50% 45%,transparent 40%,rgba(8,7,5,.7) 100%)}
  /* HUD labels */
  .hud{position:absolute;z-index:3;font-family:var(--fm);font-size:11px;letter-spacing:.05em;color:rgba(245,237,224,.6);background:rgba(8,7,5,.5);border:1px solid rgba(245,237,224,.12);padding:3px 8px;border-radius:4px}
  .hud.tl{top:20px;left:20px}.hud.tr{top:20px;right:20px}.hud.bl{bottom:20px;left:20px}
  /* caption */
  .cap{position:absolute;z-index:3;left:50%;bottom:64px;transform:translateX(-50%);text-align:center;max-width:640px;padding:0 24px}
  .cap h1{font-family:var(--fd);font-size:clamp(28px,5vw,52px);line-height:1.05;letter-spacing:-.02em}
  .cap h1 em{font-style:italic;color:var(--amber-l)}
  .cap p{font-size:14px;color:rgba(245,237,224,.6);margin-top:10px}
  /* mode switch */
  .modes{position:absolute;z-index:3;top:20px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(8,7,5,.55);border:1px solid rgba(245,237,224,.12);border-radius:10px;padding:4px;backdrop-filter:blur(8px)}
  .modes button{font-family:var(--fb);font-size:12px;font-weight:700;color:rgba(245,237,224,.55);background:transparent;border:none;padding:7px 14px;border-radius:7px;cursor:pointer;transition:.2s}
  .modes button.on{background:var(--amber);color:#241403}
</style>
</head>
<body>
<div class="stage">
  <video id="v" muted loop autoplay playsinline>
    <source src="assets/nature.mp4" type="video/mp4">
    <source src="assets/butterfly.mp4" type="video/mp4">
  </video>
  <canvas id="c"></canvas>
  <div class="grid"></div>
  <div class="vign"></div>
  <div class="modes" id="modes">
    <button class="on" data-m="ascii">ASCII</button>
    <button data-m="mosaic">Mosaico</button>
    <button data-m="iso">Isolíneas</button>
  </div>
  <div class="modes" id="srcs" style="top:auto;bottom:20px;transform:translateX(-50%)">
    <button class="on" data-s="nature" data-p="amber">Mariposa</button>
    <button data-s="jellyfish" data-p="teal">Medusa</button>
  </div>
  <div class="hud tl" id="srclbl">FLT · nature.mp4</div>
  <div class="hud tr" id="fps">C1 · live</div>
  <div class="hud bl">SmartPath · media/naturaleza</div>
  <div class="cap">
    <h1>La naturaleza, <em>reinterpretada</em>.</h1>
    <p>Metraje real filtrado en tiempo real: ASCII, mosaico dither e isolíneas, sobre una cuadrícula abstracta.</p>
  </div>
</div>

<script>
const v=document.getElementById('v'), c=document.getElementById('c'), ctx=c.getContext('2d');
const off=document.createElement('canvas'), octx=off.getContext('2d',{willReadFrequently:true});
let mode='ascii', W=0,H=0, cols=170, cell=0, rows=0;
const RAMP=' .:-=+*o#%@'; // dark -> light (nature-friendly)

function resize(){
  W=c.width=innerWidth; H=c.height=innerHeight;
  cell=Math.max(5, Math.floor(W/cols));
  rows=Math.ceil(H/cell);
  off.width=cols; off.height=rows;
  ctx.font=`${cell}px 'JetBrains Mono', monospace`;
  ctx.textBaseline='top';
}
addEventListener('resize',resize); resize();

document.getElementById('modes').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  mode=b.dataset.m;
  [...document.querySelectorAll('.modes button')].forEach(x=>x.classList.toggle('on',x===b));
});

let palette='amber';
function amber(t){ // t 0..1 brightness -> palette color
  let r,g,b;
  if(palette==='teal'){ r=60+120*t; g=180+70*t; b=200+55*t; }
  else { r=224+(250-224)*t; g=123+(248-123)*t; b=244*t*.9; }
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}
/* source switch (butterfly / jellyfish) */
document.getElementById('srcs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  palette=b.dataset.p;
  v.src='assets/'+b.dataset.s+'.mp4'; v.load(); v.play().catch(()=>{});
  document.getElementById('srclbl').textContent='FLT · '+b.dataset.s+'.mp4';
  [...document.querySelectorAll('#srcs button')].forEach(x=>x.classList.toggle('on',x===b));
});

function draw(){
  if(v.readyState>=2){
    // cover-fit the video into the offscreen grid
    const vr=v.videoWidth/v.videoHeight, gr=cols/rows;
    let sw=v.videoWidth, sh=v.videoHeight, sx=0, sy=0;
    if(vr>gr){ sw=v.videoHeight*gr; sx=(v.videoWidth-sw)/2; } else { sh=v.videoWidth/gr; sy=(v.videoHeight-sh)/2; }
    octx.drawImage(v, sx,sy,sw,sh, 0,0, cols,rows);
    const d=octx.getImageData(0,0,cols,rows).data;
    ctx.fillStyle='#080705'; ctx.fillRect(0,0,W,H);

    if(mode==='ascii'){
      for(let y=0;y<rows;y++){
        for(let x=0;x<cols;x++){
          const i=(y*cols+x)*4, lum=(d[i]*.3+d[i+1]*.59+d[i+2]*.11)/255;
          if(lum<0.08) continue;
          const ch=RAMP[Math.min(RAMP.length-1, Math.floor(lum*RAMP.length))];
          ctx.fillStyle=amber(lum);
          ctx.fillText(ch, x*cell, y*cell);
        }
      }
    } else if(mode==='mosaic'){
      const bayer=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
      for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
        const i=(y*cols+x)*4, lum=(d[i]*.3+d[i+1]*.59+d[i+2]*.11)/255;
        const th=(bayer[y&3][x&3]/16);
        const on=lum>th?1:0; if(!on)continue;
        const lvl=Math.min(1, lum+0.15);
        ctx.fillStyle=amber(lvl);
        const s=cell*0.82, o=(cell-s)/2;
        ctx.fillRect(x*cell+o, y*cell+o, s, s);
      }
    } else { // isolíneas: draw where luminance crosses bands
      const bands=6;
      for(let y=1;y<rows;y++)for(let x=1;x<cols;x++){
        const i=(y*cols+x)*4, lum=(d[i]*.3+d[i+1]*.59+d[i+2]*.11);
        const il=(d[(y*cols+x-1)*4]*.3+d[(y*cols+x-1)*4+1]*.59+d[(y*cols+x-1)*4+2]*.11);
        const iu=(d[((y-1)*cols+x)*4]*.3+d[((y-1)*cols+x)*4+1]*.59+d[((y-1)*cols+x)*4+2]*.11);
        const b1=Math.floor(lum/255*bands), b2=Math.floor(il/255*bands), b3=Math.floor(iu/255*bands);
        if(b1!==b2||b1!==b3){
          ctx.fillStyle=amber(0.3+b1/bands*0.7);
          ctx.fillRect(x*cell, y*cell, Math.max(1,cell*0.5), Math.max(1,cell*0.5));
        }
      }
    }
  }
  requestAnimationFrame(draw);
}
v.play().catch(()=>{}); requestAnimationFrame(draw);
</script>
</body>
</html>

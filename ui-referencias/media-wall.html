<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPath — Pared de medios (reutilizable)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--fm:'JetBrains Mono',monospace;--fd:'Fraunces',serif;--fb:'Space Grotesk',sans-serif}
  body{background:#060607;overflow:hidden;font-family:var(--fb);color:#faf8f4}
  .wall{position:fixed;inset:0;overflow:hidden;background:#060607}
  .tile{position:absolute;overflow:hidden;border:1px solid rgba(60,58,54,.6);background:#0a0908}
  .tile video,.tile canvas{width:100%;height:100%;object-fit:cover;display:block}
  .tile .lab{position:absolute;top:6px;left:6px;font-family:var(--fm);font-size:10px;font-weight:600;color:#c8beb0;background:rgba(8,8,8,.7);padding:1px 6px;border-radius:3px;z-index:2}
  .tile .lab.s{color:#a6e88c}
  .tile .co{position:absolute;bottom:6px;right:6px;font-family:var(--fm);font-size:10px;color:#a89f92;background:rgba(8,8,8,.7);padding:1px 6px;border-radius:3px;z-index:2}
  .b-amber{background:radial-gradient(circle at 50% 45%,#ffbf7d,#e07b00 40%,#3a2510 90%)}
  .b-blue{background:radial-gradient(circle at 45% 40%,#bcd2ff,#5f83e0 45%,#1a2340 92%)}
  .b-violet{background:radial-gradient(circle at 50% 55%,#e6ccff,#9c6cff 45%,#241a3a 92%)}
  .b-rose{background:radial-gradient(circle at 50% 45%,#ffcfe4,#e874a4 45%,#3a1c2a 92%)}
  .b-cream{background:linear-gradient(135deg,#efe9de,#d6cab5)}
  .grid{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:.5;mix-blend-mode:overlay;
    background:linear-gradient(rgba(245,237,224,.06) 1px,transparent 1px) 0 0/100% 96px,
               linear-gradient(90deg,rgba(245,237,224,.06) 1px,transparent 1px) 0 0/132px 100%}
  /* optional readable overlay for content on top */
  .content{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .content .card{background:rgba(10,9,8,.55);backdrop-filter:blur(10px);border:1px solid rgba(245,237,224,.12);border-radius:20px;padding:26px 30px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .content h1{font-family:var(--fd);font-size:34px;letter-spacing:-.02em}
  .content h1 em{font-style:italic;color:#f7a927}
  .content p{font-size:13px;color:rgba(245,237,224,.6);margin-top:8px}
  .toggle{position:fixed;z-index:11;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(10,9,8,.6);border:1px solid rgba(245,237,224,.14);border-radius:10px;padding:4px}
  .toggle button{font-family:var(--fb);font-size:12px;font-weight:700;color:rgba(245,237,224,.6);background:none;border:none;padding:6px 12px;border-radius:7px;cursor:pointer}
  .toggle button.on{background:#e07b00;color:#241403}
</style>
</head>
<body>
<div class="wall" id="wall">
  <!-- hidden source videos -->
  <video id="bfly" src="assets/nature.mp4" muted loop autoplay playsinline style="display:none"></video>
  <video id="jelly" src="assets/jellyfish.mp4" muted loop autoplay playsinline style="display:none"></video>
</div>
<div class="grid"></div>

<div class="toggle" id="toggle">
  <button class="on" data-c="off">Solo fondo</button>
  <button data-c="on">Con tarjeta</button>
</div>
<div class="content" id="content" style="display:none">
  <div class="card">
    <h1>La naturaleza, <em>reinterpretada</em></h1>
    <p>Fondo reutilizable: login, encabezados, estados vacíos, valla de anuncios.</p>
  </div>
</div>

<script>
const wall=document.getElementById('wall');
const bfly=document.getElementById('bfly'), jelly=document.getElementById('jelly');
const palettes={
  amber:v=>`rgb(${224+26*v|0},${123+125*v|0},${(244*v*.9)|0})`,
  teal :v=>`rgb(${60+120*v|0},${180+70*v|0},${200+55*v|0})`,
  pink :v=>`rgb(${180+70*v|0},${40+60*v|0},${120+120*v|0})`
};
// tile defs: [x%,y%,w%,h%, type, opts, label, coord]
const TILES=[
 [0,0,25,23,'filter',{src:'bfly',mode:'dither',pal:'pink'},'FLT','00.0,04.2'],
 [0,24,26,33,'filter',{src:'bfly',mode:'dither',pal:'pink'},'C1','00.0,08.4'],
 [0,58,25,42,'filter',{src:'bfly',mode:'ascii',pal:'amber'},'C4','00.0,08.4'],
 [26,38,8,33,'bloom',{c:'b-cream'},'C2','05.2,04.2'],
 [34.5,24,22,55,'bloom',{c:'b-rose'},'S01','08.9,07.1'],
 [34.5,0,22,23,'raw',{src:'bfly'},'',''],
 [43,24,13,43,'raw',{src:'jelly'},'S02','06.9,02.0'],
 [43,68,22,32,'bloom',{c:'b-blue'},'C3','08.9,07.1'],
 [57,0,22,23,'bloom',{c:'b-cream'},'',''],
 [57,24,13,44,'filter',{src:'jelly',mode:'ascii',pal:'teal'},'','16.0,04.8'],
 [70,7,30,50,'bloom',{c:'b-amber'},'S03','18.9,00.7'],
 [70,58,30,20,'filter',{src:'jelly',mode:'dither',pal:'teal'},'C3','16.0,04.8'],
 [70,79,30,7,'bloom',{c:'b-cream'},'',''],
 [70,86,30,14,'bloom',{c:'b-violet'},'C4','16.0,08.4'],
];
const filters=[];
for(const [x,y,w,h,type,opts,lab,co] of TILES){
  const t=document.createElement('div'); t.className='tile';
  t.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;
  if(type==='raw'){
    const s=document.getElementById(opts.src);
    const vv=document.createElement('video'); vv.src=s.src; vv.muted=vv.loop=vv.autoplay=vv.playsInline=true;
    vv.play().catch(()=>{}); t.appendChild(vv);
  } else if(type==='bloom'){
    const b=document.createElement('div'); b.style.cssText='position:absolute;inset:0'; b.className=opts.c; t.appendChild(b);
  } else if(type==='filter'){
    const cv=document.createElement('canvas'); t.appendChild(cv);
    filters.push({cv,ctx:cv.getContext('2d'),src:opts.src,mode:opts.mode,pal:opts.pal});
  }
  if(lab){const l=document.createElement('div');l.className='lab'+(lab[0]==='S'?' s':'');l.textContent=lab;t.appendChild(l);}
  if(co){const c=document.createElement('div');c.className='co';c.textContent=co;t.appendChild(c);}
  wall.appendChild(t);
}
// shared offscreen for sampling
const off=document.createElement('canvas'), octx=off.getContext('2d',{willReadFrequently:true});
function renderFilter(fl){
  const v=document.getElementById(fl.src); if(v.readyState<2) return;
  const cw=Math.max(60,fl.cv.clientWidth), chh=Math.max(60,fl.cv.clientHeight);
  const cell = fl.mode==='ascii'?7:8;
  const cols=Math.floor(cw/cell), rows=Math.floor(chh/cell);
  if(fl.cv.width!==cols*cell){fl.cv.width=cols*cell;fl.cv.height=rows*cell;}
  off.width=cols; off.height=rows;
  const vr=v.videoWidth/v.videoHeight, gr=cols/rows; let sw=v.videoWidth,sh=v.videoHeight,sx=0,sy=0;
  if(vr>gr){sw=v.videoHeight*gr;sx=(v.videoWidth-sw)/2;}else{sh=v.videoWidth/gr;sy=(v.videoHeight-sh)/2;}
  octx.drawImage(v,sx,sy,sw,sh,0,0,cols,rows);
  const d=octx.getImageData(0,0,cols,rows).data, ctx=fl.ctx, col=palettes[fl.pal];
  ctx.fillStyle='#0a0908'; ctx.fillRect(0,0,fl.cv.width,fl.cv.height);
  const RAMP=' .:-=+*o#%@', bay=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  if(fl.mode==='ascii'){ ctx.font=`${cell}px 'JetBrains Mono',monospace`; ctx.textBaseline='top';
    for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const i=(y*cols+x)*4,l=(d[i]*.3+d[i+1]*.59+d[i+2]*.11)/255;
      if(l<0.08)continue; ctx.fillStyle=col(l); ctx.fillText(RAMP[Math.min(10,l*11|0)],x*cell,y*cell);}
  } else { for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const i=(y*cols+x)*4,l=(d[i]*.3+d[i+1]*.59+d[i+2]*.11)/255;
      if(l<=bay[y&3][x&3]/16)continue; ctx.fillStyle=col(Math.min(1,l+0.15));
      const s=cell*0.8,o=(cell-s)/2; ctx.fillRect(x*cell+o,y*cell+o,s,s);} }
}
function loop(){ filters.forEach(renderFilter); requestAnimationFrame(loop); }
[bfly,jelly].forEach(v=>v.play().catch(()=>{})); requestAnimationFrame(loop);

document.getElementById('toggle').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  document.getElementById('content').style.display=b.dataset.c==='on'?'flex':'none';
  [...document.querySelectorAll('.toggle button')].forEach(x=>x.classList.toggle('on',x===b));
});
</script>
</body>
</html>
